<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .header {
        display: flex;
        justify-content: center;
        width: 100%;
        height: 109px;
      }
      input {
        width: 300px;
        height: 30px;
        margin: 20px 0 20px 20px;
        font-size: 16px;
        padding: 20px;
        border-radius: 30px;
      }
      .search {
        display: flex;
        justify-content: space-around;
        position: relative;
        bottom: 60px;
      }
      .pokemon_list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .pokemon_item {
        width: 200px;
        border: 2px solid whitesmoke;
        border-radius: 10px;
        text-align: center;
      }
      .image {
        width: 100%;
        height: 70%;
        object-fit: cover;
        display: flex;
        justify-content: space-around;
      }
      .image img {
        transition: 0.3s;
      }
      .image:hover img {
        box-shadow: 10px 10px 5px gray;
      }
      .id {
        width: 100%;
        height: 10%;
        background-color: aqua;
      }
      .name {
        width: 100%;
        height: 10%;
        position: relative;
        bottom: 30px;
        text-align: center;
        font-weight: bold;
      }

      .type {
        display: inline-flex;
        margin-right: 10px;
        justify-content: center;
        position: relative;
        bottom: 25px;
        background-color: khaki;
        border: 2px solid hotpink;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>POKEMON API</h2>
    </div>
    <div class="search">
      <input type="text" placeholder="Nhập tên pokemon" />
    </div>
    <div class="pokemon_list"></div>
